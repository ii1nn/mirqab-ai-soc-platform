# Serves the built SPA only — API/WebSocket proxying is owned by the
# top-level reverse proxy (infra/docker/nginx/nginx.conf), not this container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
