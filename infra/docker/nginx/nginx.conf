worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # $upstream_addr records which actual backend container IP served each
    # request — the way to *prove* multi-replica scaling is distributing
    # traffic (see docs/phases/phase-11.md), not just that it doesn't error.
    log_format upstream_log '$remote_addr - [$time_local] "$request" $status upstream=$upstream_addr';
    access_log /var/log/nginx/access.log upstream_log;

    # Socket.IO negotiates ws:// after an initial HTTP handshake on this path —
    # the namespace (/realtime) is carried in the handshake payload, not the
    # URL, so this is the one path that needs the Upgrade/Connection headers.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker's embedded DNS server — resolves service names to every live
    # replica's IP, round-robin, and (unlike a plain OS resolver call) picks
    # up replicas added/removed by `docker compose up --scale` within
    # `valid`'s TTL rather than caching the answer from container start.
    resolver 127.0.0.11 valid=10s;

    # Plain HTTP exists only to redirect to HTTPS — certs/generate-self-signed-cert.sh
    # makes a dev cert so this works out of the box; swap in a real cert (e.g. via
    # certbot's HTTP-01 challenge, which needs this server block's / left reachable
    # over plain HTTP) for a non-localhost deployment.
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Phase 13 (closes baseline finding P1-8 — "outer nginx sets no
        # security headers on the served frontend"): NestJS's helmet()
        # (main.ts) only ever covers /api/v1/* JSON responses; the actual
        # HTML/JS/CSS the browser loads through this server block got none
        # of these. `add_header` here at the server level applies to every
        # location below (api/v1, socket.io, and the SPA) since none of
        # them declare their own add_header — nginx only stops inheriting
        # from the server block once a location sets at least one itself.
        # No Content-Security-Policy here — deliberately deferred, not
        # omitted by oversight: this app renders framer-motion animations
        # (inline `style` attribute mutations at runtime) and Tailwind's
        # generated stylesheet, and confirming a CSP's style-src wouldn't
        # visibly break the UI needs a live browser check this phase's
        # resource constraints don't support (see the Phase 13 report).
        # Every other header below has no such risk — confirmed safe by
        # static inspection (no inline <script>, no camera/mic/geolocation
        # API usage anywhere in the frontend source).
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=15552000" always;

        # A *variable* in proxy_pass is what forces nginx to re-resolve
        # `backend` via the `resolver` above at request time, instead of
        # once at config load (which a plain `upstream { server backend:3000; }`
        # block — or a bare `proxy_pass http://backend:3000` — would do,
        # freezing in whichever single replica existed when nginx started).
        # This is the actual fix for `docker compose up --scale backend=N`:
        # without it, only one of the N replicas would ever receive traffic.
        set $backend_upstream backend:3000;

        # Same reasoning as $backend_upstream: a static `upstream { server
        # soc-dashboard:80; }` block resolves DNS once at nginx startup and
        # caches it for nginx's lifetime, not the container's — rebuilding
        # just the soc-dashboard service (its container gets a new IP) then
        # leaves nginx proxying to a dead IP until nginx itself restarts.
        # Only ever running one replica doesn't avoid that; it just makes it
        # less likely to be noticed than the backend's scale=N case.
        set $soc_dashboard_upstream soc-dashboard:80;

        location /api/v1/ {
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Phase 2: POST /ai/incidents/:id/actions (ISOLATE_DEVICE) can
            # genuinely take up to EXECUTION_CONFIRMATION_TIMEOUT_MS (60s,
            # see wazuh-active-response.provider.ts) waiting for the agent's
            # real callback before the backend itself responds. nginx's
            # compiled-in default proxy_read_timeout is also 60s, so without
            # this override nginx could kill the connection with a 504 at the
            # exact moment the backend was about to return a genuine result —
            # confirmed live: a real, successful isolation was cut off this
            # way. Kept longer than the backend's own wait, not equal to it.
            proxy_read_timeout 90s;
        }

        location /socket.io/ {
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            # Phase 12: matches the /api/v1/ block above — RealtimeGateway's
            # per-IP connection-attempt limiter (realtime.gateway.ts) reads
            # this header (falling back to the raw peer address when it's
            # absent or the peer isn't itself on a trusted private network —
            # see resolveClientAddress's doc comment) since engine.io, unlike
            # Express, never consults X-Forwarded-For on its own regardless
            # of Nest's `trust proxy` setting (main.ts) — confirmed by
            # reading engine.io's own Socket.remoteAddress implementation,
            # which reads the raw TCP socket only. Without this header, every
            # real client behind nginx would appear as nginx's own address,
            # making that limiter a global bucket shared by every user —
            # exactly the bug Phase 11 fixed for the REST throttle, here for
            # a different subsystem that isn't fixed by the same mechanism.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location / {
            proxy_pass http://$soc_dashboard_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
